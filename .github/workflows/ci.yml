name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (all features)
        run: cargo build --all-features

  fullrust:
    name: fullrust (libc-free static Linux)
    runs-on: ubuntu-latest
    # `x86_64-unknown-linux-fullrust` is a patched toolchain whose std talks to
    # the kernel through raw syscalls instead of libc. The target is NOT in the
    # `unix` family (`cfg(unix)` and `cfg(windows)` are both false), so
    # dependencies fall back to their "other platform" arms — which may compile
    # yet fail at runtime. Build and test here so that can't creep back in.
    #
    # The image is pinned to Rust 1.89, this crate's `rust-version`. It ships no
    # rustdoc, hence `--lib --tests` (no doctests).
    steps:
      - uses: actions/checkout@v6

      - name: Build (all features)
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:1.89
          args: --all-features

      - name: Test (all features)
        uses: KarpelesLab/fullrust@master
        with:
          image: ghcr.io/karpeleslab/fullrust:1.89
          command: test
          args: --all-features --lib --tests

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
